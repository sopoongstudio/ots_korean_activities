<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>문구점 게임</title><style>
:root{--bg:#F3F8FF;--ink:#1B2B4B;--sub:#5B6B8C;--blue:#2563C9;--blue-l:#DCE9FF;--org:#F59E42;--org-l:#FFEBD2;--grn:#2E9E5B;--grn-l:#D9F3E3;--wood:#E9C79B;--wood-d:#C9995C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Noto Sans KR","Apple SD Gothic Neo",sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;font-size:clamp(14px,2.6vh,22px);padding:1vh 2vw}
button.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue);font-size:clamp(12px,2vh,16px);padding:.6vh 1.2vw}
.scene{position:absolute;inset:0;display:none;flex-direction:column}
.scene.on{display:flex}
.top{display:flex;align-items:baseline;gap:12px;padding:1.6vh 3vw 0}
.top h1{font-size:clamp(20px,4vh,34px);color:var(--blue)}
.top span{color:var(--sub);font-size:clamp(12px,2vh,16px)}
.top .sp{flex:1}
/* outside */
.street{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
.front{width:min(62vw,720px);background:#fff;border:3px solid var(--blue-l);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(37,99,201,.12)}
.awning{height:9vh;background:repeating-linear-gradient(90deg,var(--blue) 0 6.25%,#fff 6.25% 12.5%);border-bottom:4px solid var(--blue)}
.sign{text-align:center;font-size:clamp(26px,6vh,52px);font-weight:700;padding:1.4vh 0;color:var(--ink)}
.sign small{display:block;font-size:.34em;color:var(--sub);font-weight:400}
.doorrow{display:flex;justify-content:center;gap:3vw;padding:0 0 0 0;align-items:flex-end;background:#EAF2FF}
.win{width:22%;height:16vh;margin-bottom:3vh;background:#CFE3FF;border:4px solid #fff;border-radius:8px;box-shadow:inset 0 0 0 3px var(--blue-l)}
.door{width:26%;height:30vh;background:var(--wood);border:4px solid var(--wood-d);border-bottom:none;border-radius:10px 10px 0 0;position:relative;cursor:pointer;transition:transform .5s;transform-origin:left center}
.door:hover{filter:brightness(1.05)}
.door::before{content:"";position:absolute;left:12%;right:12%;top:10%;height:38%;background:#CFE3FF;border:3px solid var(--wood-d);border-radius:6px}
.door::after{content:"";position:absolute;right:10%;top:55%;width:2.2vh;height:2.2vh;background:var(--blue);border-radius:50%}
.door.open{transform:perspective(600px) rotateY(-70deg)}
.hint{font-size:clamp(14px,2.6vh,22px);font-weight:700;color:var(--blue);text-align:center}
.hint small{display:block;font-weight:400;color:var(--sub);font-size:.7em}
/* inside */
.inside{flex:1;display:flex;flex-direction:column;min-height:0}
.owner{display:flex;align-items:center;gap:1.4vw;padding:1.2vh 3vw 0;min-height:15vh}
.owner svg{height:13vh;flex:none}
.bub{background:var(--org-l);border:3px solid var(--org);border-radius:18px;padding:.8vh 1.6vw;font-size:clamp(20px,4.2vh,36px);font-weight:700;opacity:0;transform:scale(.9);transition:.25s;position:relative}
.bub small{display:block;font-size:.4em;color:var(--sub);font-weight:400}
.bub.show{opacity:1;transform:scale(1)}
.shelf{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:1.4vh 1.2vw;padding:1.4vh 3vw}
.item{background:#fff;border:2px solid var(--blue-l);border-bottom:6px solid var(--wood-d);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3vh;cursor:pointer;transition:.2s;min-height:0}
.item:hover{border-color:var(--blue);border-bottom-color:var(--wood-d);transform:translateY(-2px)}
.item img{height:42%;max-height:84px;aspect-ratio:1}
.item b{font-size:clamp(20px,4vh,34px)}
.item small{color:var(--sub);font-size:clamp(11px,1.9vh,15px)}
.item.gone{visibility:hidden}
.shelf:not(.labels) .item b,.shelf:not(.labels) .item small{display:none}
.shelf:not(.labels) .item img{height:62%;max-height:130px}
.slotrow{display:flex;gap:.6vw;align-items:center}
.slot{width:9vh;height:9vh;border:3px dashed var(--org);border-radius:12px;display:flex;align-items:center;justify-content:center}
.slot img{height:80%;animation:pop .4s}
.item.dim{opacity:.35;pointer-events:none}
.bar{margin:0 3vw 1.6vh;background:#fff;border:2px solid var(--org);border-radius:16px;display:flex;align-items:center;gap:1.4vw;padding:1vh 1.4vw;min-height:12vh}
.prompt{margin-left:auto;background:#fff;border:3px solid var(--blue);border-radius:16px;display:flex;align-items:center;gap:1vw;padding:.8vh 1.4vw;min-width:26vw}
.lab{font-weight:700;font-size:clamp(14px,2.6vh,22px)}.lab small{display:block;color:var(--sub);font-weight:400;font-size:.65em}
.exitdoor{display:flex;flex-direction:column;align-items:center;gap:.4vh;cursor:pointer;color:var(--sub);text-align:center;font-size:clamp(10px,1.7vh,13px)}
.exitdoor .dr{width:7vh;height:10vh;background:var(--wood);border:3px solid var(--wood-d);border-radius:8px 8px 0 0;position:relative;transform-origin:left center;transition:transform .5s}
.exitdoor .dr::after{content:'';position:absolute;right:12%;top:55%;width:1.4vh;height:1.4vh;background:var(--blue);border-radius:50%}
.exitdoor.locked{opacity:.4;cursor:default}
.exitdoor.ready{animation:pulse 1s infinite;color:var(--blue);font-weight:700}
.exitdoor.open .dr{transform:perspective(300px) rotateY(-70deg)}
@keyframes pulse{50%{transform:scale(1.08)}}
.say{flex:1;font-size:clamp(18px,3.6vh,30px);font-weight:700}
.say small{display:block;color:var(--sub);font-weight:400;font-size:.5em}
.tray{min-width:12vw;display:flex;align-items:center;gap:.6vw}
.tray img{height:9vh;animation:pop .4s}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.mission{margin-left:auto;background:#fff;border:3px solid var(--blue);border-radius:16px;display:flex;align-items:center;gap:1vw;padding:.8vh 1.4vw}
.mission img{height:9vh;aspect-ratio:1}
.mission div{font-size:clamp(14px,2.6vh,22px);font-weight:700;line-height:1.25}
.mission small{display:block;color:var(--sub);font-weight:400;font-size:.62em}
.mission.hide{visibility:hidden}
.item.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fly{position:fixed;z-index:9;transition:all .6s ease-in-out;pointer-events:none}
#next{display:none}#next.show{display:block;animation:pop .35s}
.hint2{min-height:3.2vh;color:var(--blue);font-weight:700;font-size:clamp(14px,2.6vh,22px)}
</style></head><body>

<div class="scene on" id="outside">
 <div class="top"><h1>문구점 게임</h1><span>Stationery shop</span></div>
 <div class="street">
  <div class="front">
   <div class="awning"></div>
   <div class="sign">문구점<small>Stationery shop</small></div>
   <div class="doorrow"><div class="win"></div><div class="door" id="door"></div><div class="win"></div></div>
  </div>
  <div class="hint" id="hint">문을 클릭하세요<small>Click the door to go in</small></div>
 </div>
</div>

<div class="scene" id="inside">
 <div class="top"><h1>문구점 게임</h1><span>Stationery shop</span><span class="sp"></span><button class="ghost" id="again">다시 / Again</button></div>
 <div class="inside">
  <div class="owner">
   <svg viewBox="0 0 100 100"><rect x="43" y="56" width="14" height="16" fill="#F2C79A"/><path d="M22 100c0-22 12-32 28-32s28 10 28 32z" fill="#2563C9"/><circle cx="50" cy="40" r="22" fill="#FFD9B3"/><path d="M28 36c0-19 44-19 44 0z" fill="#F59E0B"/><path d="M30 35h40c0 4-8 8-20 8s-20-4-20-8z" fill="#D97706"/><circle cx="42" cy="49" r="2.4" fill="#1B2B4B"/><circle cx="58" cy="49" r="2.4" fill="#1B2B4B"/><path d="M43 57q7 6 14 0" stroke="#1B2B4B" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M36 72h28l5 28H31z" fill="#F59E0B"/><rect x="43" y="84" width="14" height="9" rx="2" fill="#D97706"/></svg>
   <div class="bub" id="bub"></div>
   <div class="prompt"><div class="say" id="say"></div><button class="ghost" id="hintbtn">힌트 / Hint</button></div>
   <div class="exitdoor locked" id="exit"><div class="dr"></div><small id="exitlab">3개 사면 열려요<br>Buy 3 things</small></div>
  </div>
  <div class="shelf" id="shelf"></div>
  <div class="bar">
   <div class="lab">장바구니<small>Cart</small></div>
   <div class="slotrow" id="slots"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
  </div>
 </div>
</div>

const $=id=>document.getElementById(id);
const bub=$('bub'),shelf=$('shelf'),say=$('say');
let phase='wait',busy=false,got=[];
const hintbtn=$('hintbtn'),slots=[...document.querySelectorAll('.slot')];
function showBub(ko,en){bub.innerHTML=ko+'<small>'+en+'</small>';bub.classList.add('show')}
function art(it){return it.en==='scissors'?'':(/^[aeiou]/.test(it.en)?'an ':'a ')}
items.forEach(it=>{
 const d=document.createElement('div');d.className='item';d.id='i_'+it.k;
 d.innerHTML=`<img src="${it.img}" alt=""><b>${it.ko}</b><small>${it.en}</small>`;
 d.onclick=()=>pick(it,d);shelf.appendChild(d);
});
function setPrompt(){
 const ex=$('exit');
 if(phase==='ask'){
  say.innerHTML='____ 주세요<small>Please give me ____ ('+(got.length+1)+' of 3)</small>';
  hintbtn.style.display='';hintbtn.textContent='글자 보기 / Show words';
  ex.className='exitdoor locked';$('exitlab').innerHTML='3개 사면 열려요<br>Buy 3 things';
 }else if(phase==='thank'){
  say.innerHTML='Now say thank you.<small>Say it in Korean.</small>';
  hintbtn.style.display='';hintbtn.textContent='힌트 / Hint';
  ex.className='exitdoor ready';$('exitlab').innerHTML='문 열기<br>Open the door';
 }else{say.innerHTML='';hintbtn.style.display='none';ex.className='exitdoor locked'}
}
hintbtn.onclick=()=>{
 if(phase==='ask')shelf.classList.toggle('labels');
 else if(phase==='thank')say.innerHTML='감사합니다<small>= Thank you.</small>';
};
function enter(){
 if(busy)return;busy=true;
 $('door').classList.add('open');$('hint').style.opacity=0;
 setTimeout(()=>{
  $('outside').classList.remove('on');$('inside').classList.add('on');
  resetRound();
  setTimeout(()=>{showBub('어서 오세요.','Welcome.');setTimeout(()=>{phase='ask';setPrompt();busy=false},1400)},350);
 },550);
}
function resetRound(){
 got=[];slots.forEach(x=>x.innerHTML='');bub.classList.remove('show');shelf.classList.remove('labels');
 items.forEach(x=>$('i_'+x.k).classList.remove('gone','dim'));
 phase='wait';setPrompt();
}
function fly(img,from,to){
 const f=document.createElement('img');f.src=img;f.className='fly';
 f.style.cssText+=`left:${from.left}px;top:${from.top}px;width:${from.width}px;height:${from.height}px`;
 document.body.appendChild(f);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  f.style.left=to.left+'px';f.style.top=to.top+'px';f.style.width=to.width+'px';f.style.height=to.height+'px';
 }));
 return f;
}
function pick(it,el){
 if(phase!=='ask'||busy)return;
 busy=true;
 const im=el.querySelector('img').getBoundingClientRect();
 el.classList.add('gone');
 const ow=document.querySelector('.owner svg').getBoundingClientRect();
 const f=fly(it.img,im,{left:ow.left+ow.width*0.25,top:ow.top+ow.height*0.45,width:ow.height*0.5,height:ow.height*0.5});
 const slot=slots[got.length];
 setTimeout(()=>{
  const tr=slot.getBoundingClientRect(),sz=tr.height*0.8;
  f.style.left=(tr.left+tr.width*0.1)+'px';f.style.top=(tr.top+tr.height*0.1)+'px';f.style.width=sz+'px';f.style.height=sz+'px';
  showBub('여기 있어요.','Here you are.');
 },1100);
 setTimeout(()=>{
  f.remove();slot.innerHTML=`<img src="${it.img}" alt="">`;got.push(it);
  phase=got.length>=3?'thank':'ask';
  setTimeout(()=>{setPrompt();busy=false},900);
 },2300);
}
function leave(){
 if(busy||phase!=='thank')return;busy=true;
 $('exit').classList.remove('ready');$('exit').classList.add('open');
 setTimeout(()=>{
  $('inside').classList.remove('on');$('outside').classList.add('on');
  $('door').classList.remove('open');$('hint').style.opacity=1;
  $('hint').innerHTML='또 해 볼까요?<small>Click the door to go in again</small>';
  phase='wait';busy=false;
 },700);
}
$('door').onclick=enter;
$('exit').onclick=leave;
$('again').onclick=()=>{$('inside').classList.remove('on');$('outside').classList.add('on');$('door').classList.remove('open');$('hint').style.opacity=1;resetRound();busy=false};
</script></body></html>
