<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Hello Future Cards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* Layout: five picture cards in a wrapping grid; tap a card to flip it to the Korean answer. */
:root{--bg:#F3F6FA;--fg:#1C2B5E;--muted:#4B5563;--card:#FFFFFF;--line:#D5DCEB;--accent:#1C2B5E;--accent-fg:#F3F6FA;--pill:#FFFDF8;--pill-fg:#0F6656;--back:#1C2B5E;--back-fg:#F3F6FA;--back-sub:#B8C3E0;--display:'Noto Sans KR','DM Sans',sans-serif;--body:'DM Sans','Noto Sans KR',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111A3D;--fg:#F3F6FA;--muted:#B8C3E0;--card:#1C2B5E;--line:#34457F;--accent:#FFE38A;--accent-fg:#1C2B5E;--pill:#FFFDF8;--pill-fg:#0F6656;--back:#F3F6FA;--back-fg:#1C2B5E;--back-sub:#4B5563;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111A3D;--fg:#F3F6FA;--muted:#B8C3E0;--card:#1C2B5E;--line:#34457F;--accent:#FFE38A;--accent-fg:#1C2B5E;--pill:#FFFDF8;--pill-fg:#0F6656;--back:#F3F6FA;--back-fg:#1C2B5E;--back-sub:#4B5563;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-inline:16px;padding-block:14px 24px}
main{max-width:1100px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:6px}
.titlerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.stripe{display:flex;height:8px;border-radius:4px;overflow:hidden}
.stripe i{flex:1}
h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,44px);line-height:1.15;text-wrap:balance;margin:0}
header p{margin:0;font-size:18px;color:var(--muted);max-width:65ch}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button.ctl{font:700 15px var(--body);background:var(--accent);color:var(--accent-fg);border:0;border-radius:100px;padding:8px 18px;cursor:pointer}
button.ctl.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
button:focus-visible{outline:3px solid #9ED4FF;outline-offset:3px}
.hint{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border:2px dashed var(--line);border-radius:20px;align-items:center}
.hint b{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--tint);color:#1C2B5E;border-radius:24px;padding:6px 18px}
.chip-ko{font-family:var(--display);font-weight:700;font-size:20px}
.chip-ro{font-size:14px;font-weight:500;color:#0F6656;background:#FFFDF8;border-radius:100px;padding:0 10px}
ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.card{min-width:0}
.flip{all:unset;display:block;width:100%;cursor:pointer;perspective:1200px;border-radius:28px}
.flip:focus-visible{outline:3px solid #9ED4FF;outline-offset:4px}
.inner{display:grid;position:relative;transition:transform .5s;transform-style:preserve-3d}
.flip[aria-pressed="true"] .inner{transform:rotateY(180deg)}
.face{position:relative;grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;display:flex;flex-direction:column;gap:12px;padding:16px;min-width:0}
.front{background:var(--card);border:2px solid var(--line)}
.pic{display:block;border-radius:18px;overflow:hidden;aspect-ratio:640/520}
.pic svg{display:block;width:100%;height:100%}
.en{font-size:20px;font-weight:700;line-height:1.35;padding-inline:4px}
.tap{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding-inline:4px}
.back{transform:rotateY(180deg);background:var(--back);color:var(--back-fg);justify-content:center;align-items:center;text-align:center;border:2px solid var(--tint);box-shadow:inset 0 0 0 8px var(--tint);padding:24px}
.ko{font-family:var(--display);font-weight:900;font-size:clamp(34px,7vw,48px);line-height:1.2;text-wrap:balance}
.ro{font-size:20px;font-weight:500;background:var(--pill);color:var(--pill-fg);border-radius:100px;padding:4px 18px}
.mean{font-size:20px;color:var(--back-sub);font-weight:500}
.num{position:absolute;top:12px;left:12px;z-index:2;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font:700 20px var(--body);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--card)}
.back .num{background:var(--back-fg);color:var(--back);box-shadow:0 0 0 3px var(--back)}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
</head>

<script>
(function(){
var cards=document.querySelectorAll('.flip');
var fb=document.getElementById('flip-all-btn');
function allBack(){return Array.prototype.every.call(cards,function(b){return b.getAttribute('aria-pressed')==='true';});}
function sync(){fb.textContent=allBack()?'Flip all back':'Flip all';}
cards.forEach(function(b){b.addEventListener('click',function(){
b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');sync();});});
fb.addEventListener('click',function(){var t=allBack()?'false':'true';cards.forEach(function(b){b.setAttribute('aria-pressed',t);});sync();});
var hb=document.getElementById('hint-btn'),h=document.getElementById('hint');
hb.addEventListener('click',function(){h.hidden=!h.hidden;hb.setAttribute('aria-expanded',String(!h.hidden));hb.textContent=h.hidden?'Show hint':'Hide hint';});
})();
</script>
